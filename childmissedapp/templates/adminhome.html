<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- ICONS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background: url("https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?fm=jpg&q=60&w=3000") no-repeat center center/cover;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            height: 100%;
            position: fixed;
            left: 0;
            top: 0;
            padding: 30px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
            animation: slideLeft 0.7s ease;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
            font-size: 16px;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(6px);
        }

        /* Main */
        .main {
            margin-left: 260px;
            padding: 20px;
            width: calc(100% - 260px);
            overflow-y: auto;
            animation: fadeIn 0.8s ease;
            position: relative;
        }

        .header {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(0,0,0,0.6);
        }

        /* Top right icons */
        .top-icons {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        .icon-btn:hover {
            transform: scale(1.15);
            background: #fff;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 6px 22px rgba(0,0,0,0.25);
            backdrop-filter: blur(6px);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            animation: popUp 0.9s ease;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: #000;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
        }

        .card i {
            font-size: 48px;
            margin-bottom: 14px;
            color: #444;
            transition: 0.4s ease;
        }

        .card:hover i {
            transform: rotate(8deg) scale(1.15);
            color: #111;
        }

        .card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 15px;
            color: #444;
        }

        /* Animations */
        @keyframes slideLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popUp { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Panel</h2>

        <a href="/adminhome/"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="/userlist/"><i class="fa-solid fa-users"></i> User List</a>
        <a href="/helplist/"><i class="fa-solid fa-headset"></i> Helpline Officers</a>
        <a href="/societylist/"><i class="fa-solid fa-building"></i> Society Users</a>
        <a href="/admin_case_list/"><i class="fa-solid fa-folder-open"></i> Case Registrations</a>
        <a href="/child_detection_map/"><i class="fa-solid fa-eye"></i> Locate Child</a>
        <a href="/logout/"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="header">Welcome, Admin 👋</div>

        <!-- Small top-right icons -->
        <div class="top-icons">
            <div class="icon-btn"><i class="fa-solid fa-bell"></i></div>
            <div class="icon-btn"><i class="fa-solid fa-envelope"></i></div>
            <div class="icon-btn"><i class="fa-solid fa-gear"></i></div>
        </div>

        <div class="cards">

            <a href="/userlist/" class="card">
                <i class="fa-solid fa-users"></i>
                <h3>Total Users</h3>
                <p style="font-size: 32px; font-weight: 700; color:#424efe;">
                    {{ totalusers }}
                </p>
                <p>Registered Users</p>
            </a>

            <a href="/helplist/" class="card">
                <i class="fa-solid fa-headset"></i>
                <h3>Helpline Officers</h3>
                <p style="font-size: 32px; font-weight: 700; color:#e65c00;">
                    {{ totalhelplines }}
                </p>
                <p>Verified Helpline Accounts</p>
            </a>

            <a href="/societylist/" class="card">
                <i class="fa-solid fa-building"></i>
                <h3>Society Users</h3>
                <p style="font-size: 32px; font-weight: 700; color:#008c3b;">
                    {{ totalsociety }}
                </p>
                <p>Community Accounts</p>
            </a>

        </div>
    </div>

</body>
</html>
