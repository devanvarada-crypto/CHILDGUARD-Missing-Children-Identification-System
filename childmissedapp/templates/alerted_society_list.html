<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volunteers Alerted</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1d3557, #457b9d);
        font-family: 'Poppins', Arial, sans-serif;
    }

    .card {
        background: #ffffff;
        width: 420px;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        text-align: center;
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .icon {
        font-size: 60px;
        color: #2a9d8f;
        margin-bottom: 10px;
    }

    h2 {
        margin: 10px 0;
        color: #1d3557;
        font-size: 22px;
        font-weight: 700;
    }

    .alert-box {
        text-align: left;
        margin-top: 20px;
        max-height: 250px;
        overflow-y: auto;
    }

    .alert-item {
        background: #f1f5f9;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    .alert-item strong {
        color: #1d3557;
    }

    .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        background: linear-gradient(135deg, #2a9d8f, #1d3557);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 18px rgba(0,0,0,0.3);
    }

    .note {
        margin-top: 15px;
        font-size: 12px;
        color: #777;
    }
</style>
</head>

<body>

<div class="card">
    <div class="icon">✔</div>
    <h2>Volunteers Successfully Alerted</h2>

    <div class="alert-box">
        {% for alert in alerts %}
        <div class="alert-item">
            <strong>{{ alert.society_user.name }}</strong><br>
            {{ alert.alert_message }}<br>
            📍 Lat: {{ alert.alert_lat }}, Lng: {{ alert.alert_lng }}
        </div>
        {% empty %}
        <p>No volunteers alerted yet.</p>
        {% endfor %}
    </div>

    <a href="{% url 'helplinehome' %}" class="btn">OK</a>

    <div class="note">
        Real-time alerts delivered to nearby societies
    </div>
</div>

</body>
</html>
