<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case Submitted</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1d3557, #457b9d);
        font-family: 'Poppins', Arial, sans-serif;
    }

    .card {
        background: #ffffff;
        width: 360px;
        padding: 35px 30px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        text-align: center;
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .icon {
        font-size: 60px;
        color: #2a9d8f;
        margin-bottom: 15px;
    }

    h2 {
        margin: 10px 0;
        color: #1d3557;
        font-size: 22px;
        font-weight: 700;
    }

    p {
        font-size: 14px;
        color: #444;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .btn {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #2a9d8f, #1d3557);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
    }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 18px rgba(0,0,0,0.3);
    }

    .note {
        margin-top: 18px;
        font-size: 12px;
        color: #777;
    }
</style>
</head>

<body>

<div class="card">
    <div class="icon">✔</div>
    <h2>Case Submitted Successfully</h2>
    <p>
        Your missing child report has been registered and forwarded to the nearest helpline authorities.
        Immediate action will be initiated.
    </p>

    <a href="{% url 'user_missing_cases' %}" class="btn">Confirm</a>

    <div class="note">
        Reference ID generated • Please keep this for future tracking
    </div>
</div>

</body>
</html>
