<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile</title>

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: #f4f6f9;
    padding: 30px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    animation: fadeIn 0.5s ease;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.profile-img {
    text-align: center;
    margin-bottom: 20px;
}

.profile-img img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #1a73e8;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: 600;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 2px solid #ccc;
    font-size: 14px;
}

input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #1a73e8;
}

input[readonly] {
    background: #eee;
    cursor: not-allowed;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #1a73e8;
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #155fc1;
}

.back-btn {
    display: block;
    margin-top: 12px;
    text-align: center;
    text-decoration: none;
    color: #333;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">

<h2>Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="profile-img">
        {% if user.Image %}
            <img src="{{ user.Image.url }}">
        {% else %}
            <img src="https://via.placeholder.com/120">
        {% endif %}
    </div>

    <label>Change Profile Image</label>
    <input type="file" name="image">

    <label>Name</label>
    <input type="text" name="name" value="{{ user.name }}" required>

    <label>Age</label>
    <input type="number" name="age" value="{{ user.age }}" required>

    <label>Gender</label>
    <select name="gender" required>
    <option value="">Select</option>
    <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
    <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
    <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other</option>
</select>


    <label>Phone Number</label>
    <input type="text" name="phonenumber" value="{{ user.Phone }}" required>

    <label>Address</label>
    <textarea name="address" rows="3">{{ user.address }}</textarea>

    <label>Email (Read Only)</label>
    <input type="email" value="{{ user.email }}" readonly>

    <label>Password</label>
    <input type="password" name="password" value="{{ user.password }}" required>

    <button type="submit">Update Profile</button>
</form>

<a href="/userhome/" class="back-btn">← Back to Dashboard</a>

</div>

</body>
</html>
