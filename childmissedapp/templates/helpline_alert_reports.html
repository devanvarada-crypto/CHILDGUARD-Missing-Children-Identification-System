<!DOCTYPE html>
<html>
<head>
<title>Society Reports</title>

<style>
body {
    background:#eef2f7;
    font-family:'Segoe UI', sans-serif;
    padding:20px;
}

/* TITLE */
h2 {
    text-align:center;
    margin-bottom:20px;
    color:#2c3e50;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap:18px;
}

/* CARD */
.card {
    background:#fff;
    border-radius:12px;
    padding:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    transition:0.25s;
    display:flex;
    flex-direction:column;
}

.card:hover {
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

/* HEADER */
.child-name {
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
    color:#2c3e50;
}

/* IMAGE */
.card img {
    width:100%;
    height:150px;
    object-fit:contain;
    border-radius:8px;
    border:1px solid #ddd;
    margin-bottom:10px;
}

/* TEXT */
.info {
    font-size:13px;
    color:#555;
    margin-bottom:10px;
}

/* ACTIONS */
.actions {
    margin-top:auto;
    display:flex;
    gap:8px;
}

/* BUTTON */
.btn {
    flex:1;
    text-align:center;
    padding:8px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    transition:0.3s;
}

/* AI BUTTON */
.ai-btn {
    background:#0984e3;
    color:#fff;
}

.ai-btn:hover {
    background:#0766b3;
}

/* MAP BUTTON */
.map-btn {
    background:#00b894;
    color:#fff;
}

.map-btn:hover {
    background:#00997a;
}

/* EMPTY */
.empty {
    text-align:center;
    margin-top:30px;
    color:#777;
}
</style>
</head>

<body>

<h2>📍 Society Reports</h2>

<div class="grid">

{% for a in alerts %}
<div class="card">

    <!-- CHILD NAME -->
    <div class="child-name">
        {{ a.case.child_name }}
    </div>

    <!-- IMAGE -->
    {% if a.found_photo %}
        <img src="{{ a.found_photo.url }}">
    {% else %}
        <img src="https://via.placeholder.com/300x150?text=No+Image">
    {% endif %}

    <!-- INFO -->
    <div class="info">
        Reported near detected location <br>
        <b>Coordinates:</b> {{ a.found_lat }}, {{ a.found_lng }}
    </div>

    <!-- ACTIONS -->
    <div class="actions">

        <a href="{% url 'ai_face_verify' a.id %}" class="btn ai-btn">
            AI Verify
        </a>

        <a target="_blank"
           href="https://www.google.com/maps?q={{ a.found_lat }},{{ a.found_lng }}"
           class="btn map-btn">
           Navigate
        </a>

    </div>

</div>
{% empty %}
<div class="empty">No reports yet</div>
{% endfor %}

</div>

</body>
</html>
