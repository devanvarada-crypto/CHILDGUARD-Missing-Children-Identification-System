<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Missing Child</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                rgba(0, 0, 0, 0.55),
                rgba(0, 0, 0, 0.55)
            ),
            url("https://childhelplineinternational.org/wp-content/uploads/2025/10/CHI-Website-Homepage-Banner_1024px-wide-1024x586.png")
            no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            color: #1a1a1a;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: #155fc1;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(26,115,232,0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 18px;
        }

        .back-link a {
            text-decoration: none;
            color: #1a73e8;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #0d47a1;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Upload Missing Child</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="matched_child">Matched Child ID / Name</label>
            <input type="text" name="matched_child" id="matched_child" placeholder="Enter reference ID" required>

            <label for="photo">Child Photo</label>
            <input type="file" name="photo" id="photo" accept="image/*" required>

            <button type="submit" class="btn-submit">
                Submit Record
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'helplinehome' %}">← Back to Helpline Home</a>
        </div>
    </div>

</body>
</html>
