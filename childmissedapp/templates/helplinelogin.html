<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helpline Login</title>

<style>
/* -------- GLOBAL -------- */
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(135deg, #4c2aff, #0099ff, #4c2aff);
    background-size: 250% 250%;
    animation: bgMove 8s ease-in-out infinite;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* -------- CARD -------- */
.container {
    width: 350px;
    padding: 32px;
    border-radius: 18px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: fadeUp 0.9s ease both;
    transform-origin: center;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

@keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.container:hover {
    transform: translateY(-8px) scale(1.015);
    box-shadow: 0 26px 55px rgba(0,0,0,0.28);
}

/* -------- HEADINGS -------- */
h1 {
    margin: 0 0 20px 0;
    text-align: center;
    color: #272727;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: 1px;
}

/* -------- INPUTS -------- */
label {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

input {
    width: 100%;
    padding: 11px;
    font-size: 14px;
    margin: 6px 0 18px 0;
    border-radius: 10px;
    border: 1.4px solid #ccc;
    transition: border 0.3s, box-shadow 0.3s;
}

input:focus {
    border-color: #4c2aff;
    box-shadow: 0 0 8px rgba(76, 42, 255, 0.4);
    outline: none;
}

/* -------- BUTTON -------- */
button {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    background: linear-gradient(135deg, #4c2aff, #0099ff);
    border: none;
    color: white;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: transform 0.25s, box-shadow 0.25s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 18px rgba(0,0,0,0.25);
}

/* -------- SMALL TEXT -------- */
.note {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: #333;
}

.back-btn {
    display: block;
    margin-top: 14px;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    color: #4c2aff;
    border: 2px solid #4c2aff;
    transition: all 0.3s ease;
}

.back-btn:hover {
    background: #4c2aff;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

</style>
</head>

<body>
    <div class="container">
        <form method="post">
            {% csrf_token %}
            <h1>Helpline Login</h1>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">LOGIN</button>
           

            <div class="note">Official access for registered helpline staff only</div>
        </form>
    </div>
</body>
</html>
