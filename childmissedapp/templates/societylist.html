<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society List</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            background: url("https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?fm=jpg&q=60&w=3000") no-repeat center/cover;
            backdrop-filter: blur(3px);
        }

        .container {
            width: 90%;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            animation: fadeIn 0.8s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }

        .search-box {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .search-box input {
            width: 75%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #888;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #4b6cff;
            box-shadow: 0 0 8px rgba(75,108,255,0.4);
        }

        .back-btn {
            padding: 12px 18px;
            background: #333;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
            font-size: 15px;
        }

        .back-btn:hover {
            background: #000;
            transform: translateY(-3px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #4b6cff;
            color: white;
            padding: 14px;
            font-size: 16px;
        }

        td {
            padding: 12px;
            background: rgba(255,255,255,0.9);
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover td {
            background: rgba(75,108,255,0.08);
            transition: 0.3s;
        }

        img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #555;
        }

        .delete-btn {
            padding: 8px 14px;
            background: #e63946;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #c72733;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        function searchTable() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let rows = document.getElementById("societyTable").rows;

            for (let i = 1; i < rows.length; i++) {
                let text = rows[i].innerText.toLowerCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        function confirmDelete() {
            return confirm("Are you sure you want to delete this user?");
        }
    </script>

</head>

<body>

<div class="container">

    <h1>Society Users List</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search society users..." onkeyup="searchTable()">
        <a href="/adminhome/" class="back-btn">← Back</a>
    </div>

    <table id="societyTable">
        <tr>
            <th>Photo</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Bio</th>
            <th>Action</th>
        </tr>

        {% for i in society %}
        <tr>
            <td>
                {% if i.image %}
                <img src="{{ i.image.url }}" alt="">
                {% else %}
                <img src="https://via.placeholder.com/55" alt="">
                {% endif %}
            </td>

            <td>{{ i.name }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.phone }}</td>
            <td>{{ i.bio }}</td>

            <td>
                <a href="{% url 'deletesociety' i.id %}" class="delete-btn" onclick="return confirmDelete()">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
