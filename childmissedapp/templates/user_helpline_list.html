<!DOCTYPE html>
<html>
<head>
    <title>Helpline List</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 20px;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .name {
            font-size: 18px;
            font-weight: bold;
        }

        .location {
            color: #555;
        }

        .phone {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Available Helplines</h2>

<form method="GET">
    <input
        type="text"
        name="q"
        class="search-box"
        placeholder="Search by helpline name or location..."
        value="{{ query }}"
    >
</form>

{% for h in helplines %}
    <div class="card">
        <div class="name">{{ h.name }}</div>
        <div class="location">📍 {{ h.location }}</div>
        <div class="phone">📞 {{ h.phone }}</div>
    </div>
{% empty %}
    <p>No helplines found.</p>
{% endfor %}

</body>
</html>
