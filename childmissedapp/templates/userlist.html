<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List - Card View</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            background: url("https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fGNoaWxkcmVufGVufDB8fDB8fHww") 
                no-repeat center center/cover;
            min-height: 100vh;
            backdrop-filter: blur(1px);
        }

        .container {
            width: 90%;
            margin: 40px auto;
            background: rgba(255,255,255,0.85);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            backdrop-filter: blur(6px);
            animation: fadeIn 0.6s ease;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 30px;
            color: #2d2d2d;
            font-weight: 600;
        }

        /* Back Button */
        .back-btn {
            padding: 10px 18px;
            background: #424efe;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2f3bcc;
        }

        /* Search Bar */
        #searchInput {
            width: 100%;
            padding: 13px;
            margin: 20px 0;
            border: 1px solid #aaa;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        /* Card Container */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        /* Card Style */
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: 0.3s;
            animation: fadeUp 0.5s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 3px solid #424efe;
        }

        .card h3 {
            margin: 8px 0;
            color: #333;
        }

        .card p {
            margin: 5px 0;
            color: #555;
            font-size: 14px;
        }

        /* Delete Button */
        .delete-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: #e02121;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #b31313;
            transform: scale(1.05);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

<div class="container">
    <a href="/adminhome/" class="back-btn">← Back</a>

    <h2>User Management</h2>

    <input type="text" id="searchInput" placeholder="Search users..." onkeyup="searchCards()">

    <div class="card-grid" id="cardContainer">
        {% for u in user %}
        <div class="card">
            {% if u.Image %}
                <img src="{{ u.Image.url }}" class="profile-img">
            {% else %}
                <img src="https://via.placeholder.com/90" class="profile-img">
            {% endif %}

            <h3>{{ u.name }}</h3>
            <p><strong>Age:</strong> {{ u.age }}</p>
            <p><strong>Gender:</strong> {{ u.get_gender_display }}</p>
            <p><strong>Email:</strong> {{ u.email }}</p>
            <p><strong>Phone:</strong> {{ u.Phone }}</p>

            <a class="delete-btn" onclick="confirmDelete('{{ u.id }}')">Delete</a>
        </div>
        {% empty %}
        <p>No users found.</p>
        {% endfor %}
    </div>
</div>

<script>
    /* Search Filter for Cards */
    function searchCards() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let cards = document.querySelectorAll(".card");

        cards.forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(input) ? "block" : "none";
        });
    }

    /* Delete Confirmation */
    function confirmDelete(id) {
        if (confirm("Are you sure you want to delete this user?")) {
            window.location.href = "/deleteuser/" + id + "/";
            alert("User deleted successfully!");
        }
    }
</script>

</body>
</html>
